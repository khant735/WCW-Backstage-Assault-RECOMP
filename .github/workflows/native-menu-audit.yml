name: Native menu source audit
on:
  push:
    paths:
      - '.github/workflows/native-menu-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate original menu data and source references
        run: |
          python3 - <<'PY' > native-menu-audit.txt
          from pathlib import Path
          import re
          terms = re.compile(r'global[ _-]*options|music[ _-]*volume|speech[ _-]*volume|crowd[ _-]*volume|sound[ _-]*fx|realism|vibration|move[ _-]*names|intro[ _-]*videos', re.I)
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() not in ('.c','.h','.cpp','.txt','.json','.toml','.bin','.74','.dat','.ranges'): continue
              data = p.read_bytes()
              for m in terms.finditer(data.decode('latin1')):
                  if p.suffix.lower() in ('.c','.h','.cpp','.txt','.json','.toml','.ranges'):
                      line = data[:m.start()].count(b'\n')+1
                      print(p, 'line',line,repr(data[max(0,m.start()-80):m.end()+80]))
                  else:
                      print(p,'offset',hex(m.start()),repr(data[max(0,m.start()-16):m.end()+16]))
          print('END MENU AUDIT')
          PY
          head -n 200 native-menu-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-menu-audit
          path: native-menu-audit.txt
