name: Windows x64 build
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub pre-release
        type: boolean
        default: false
      version:
        description: Release tag (e.g. v0.15B.3)
        type: string
        default: v0.15B.3
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        shell: pwsh
        run: |
          $required = @('CMakeLists.txt','build-windows.ps1','game.toml','generated/SLUS_012.74_dispatch.c','generated/overlays_static.c','runtime_patches/PATCHED_FILES.txt','compat/zlib_compat.c','Launch.cmd')
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing required source: $f" } }
          if (!(Get-ChildItem generated/SLUS_012.74_full_*.c)) { throw 'Missing generated C shards' }
      - name: Fetch pinned framework
        shell: pwsh
        run: |
          git clone https://github.com/mstan/psxrecomp.git psxrecomp
          git -C psxrecomp checkout 8077e71098ce0347d7d41d267630bc856816cf77
          git -C psxrecomp submodule update --init --recursive
          foreach ($p in Get-ChildItem runtime_patches/*.patch) {
            git -C psxrecomp apply --check $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $p" }
            git -C psxrecomp apply $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $p" }
          }
      - name: Compile
        shell: pwsh
        run: ./build-windows.ps1
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-release -Recurse -Filter WCWBackstageAssault_Recompiled.exe | Select-Object -First 1
          if (!$exe) { throw 'Executable missing' }
          New-Item -ItemType Directory dist -Force
          Copy-Item $exe.FullName dist
          Copy-Item game.toml,Launch.cmd,Launch_*.cmd dist
          if (Test-Path build-release/bios) { Copy-Item build-release/bios dist/bios -Recurse }
          if (Test-Path build-release/assets) { Copy-Item build-release/assets dist/assets -Recurse }
          Compress-Archive -Path dist/* -DestinationPath WCW-Windows-x64.zip
          $hash = (Get-FileHash WCW-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WCW-Windows-x64.zip" | Set-Content WCW-Windows-x64.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: WCW-Windows-x64
          path: |
            WCW-Windows-x64.zip
            WCW-Windows-x64.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WCW-Windows-x64
      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9][0-9A-Za-z.-]*$') { throw 'Invalid release tag' }
          gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; choose a new version.' }
          $notes = @'
          Experimental Windows x64 build of WCW Backstage Assault RECOMP.
          Requires your own legally obtained USA game disc image (SLUS-01274).
          Automated compilation passed; gameplay validation remains outstanding.
          Credits: WCW Mayhem RECOMP (https://github.com/dotGrx/WCW-Mayhem-RECOMP), PSXRecomp, SDL3 and OpenBIOS contributors.
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create $tag WCW-Windows-x64.zip WCW-Windows-x64.sha256 --repo $env:GH_REPO --target $env:BUILD_SHA --title "WCW Backstage Assault RECOMP - $tag" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
