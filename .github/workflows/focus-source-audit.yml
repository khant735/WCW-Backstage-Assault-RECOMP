name: Free Focus source audit
on:
  push:
    paths:
      - '.github/workflows/focus-source-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract candidate instruction context
        shell: bash
        run: |
          python3 - <<'PY' > focus-source-audit.txt
          from pathlib import Path
          import re
          targets = ['80018090','8006F430','80013EF4','80018074','8006EBB0','8006E960','8006E96C']
          pattern = re.compile(r'0x(?:' + '|'.join(targets) + r')\b', re.I)
          for path in sorted(Path('generated').glob('*.c')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines):
                  if pattern.search(line):
                      print(f'=== {path}:{i+1} ===')
                      for n in range(max(0,i-45),min(len(lines),i+46)):
                          print(f'{n+1}: {lines[n]}')
          PY
          wc -l focus-source-audit.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path('generated').glob('SLUS_012.74_full_*.c')):
              lines = path.read_text().splitlines()
              for i,line in enumerate(lines):
                  if re.search(r'/\* 0x(?:80018090|8006F430|8006EBB0|8006E960|8006E96C):',line,re.I):
                      print(path, i+1)
                      for s in lines[max(0,i-100):i+150]:
                          if re.search(r'/\* 0x[0-9A-Fa-f]{8}:|goto block_|cpu->gpr\[31\] =|psx_cyc_load|cpu->write_',s):
                              print(s.strip())
          PY
      - name: Locate controller API references
        run: |
          grep -inE 'PadRead|PadInit|PadStart|PadGetState|PadInfo|PadSet|InitPAD|StartPAD|ChangeClearPAD|0x1f80104[048ace]' generated/*.c > controller-api-audit.txt || true
          wc -l controller-api-audit.txt
          cut -c1-300 controller-api-audit.txt | head -n 100
      - name: Audit split hardware addresses and BIOS call candidates
        run: |
          python3 - <<'PY' > pad-hardware-audit.txt
          from pathlib import Path
          import re
          for path in sorted(Path('generated').glob('*.c')):
              ops = []
              for line in path.read_text().splitlines():
                  m = re.search(r'/\* 0x([0-9a-f]{8}): 0x([0-9a-f]{8}) \*/',line,re.I)
                  if m:
                      ops.append((int(m[1],16),int(m[2],16)))
              for i,(pc,w) in enumerate(ops):
                  if w >> 26 == 15 and w & 65535 in (0x1f80,0xbf80,0x9f80):
                      reg = (w >> 16) & 31
                      for q,v in ops[i+1:i+25]:
                          if q-pc > 96 or q <= pc: break
                          if (v >> 21)&31 == reg and v&65535 in range(0x1040,0x1050):
                              print(path.name,hex(pc),hex(q),hex(v))
                  if w >> 26 == 3 and (w & 0x3ffffff)*4 in (0xa0,0xb0,0xc0):
                      print(path.name,hex(pc),'BIOS JAL',hex((w&0x3ffffff)*4))
          PY
          wc -l pad-hardware-audit.txt
          head -n 120 pad-hardware-audit.txt
      - name: Extract observed BIOS callers
        run: |
          python3 - <<'PY' > pad-callers.txt
          from pathlib import Path
          import re
          targets = [0x800529a0,0x8005fef8,0x8005ff6c]
          for path in sorted(Path('generated').glob('*.c')):
              for line in path.read_text().splitlines():
                  m = re.search(r'/\* 0x([0-9a-f]{8}): 0x([0-9a-f]{8}) \*/',line,re.I)
                  if m and any(t-96 <= int(m[1],16) <= t+48 for t in targets):
                      print(path.name,m[1],m[2],line.strip())
          PY
          cat pad-callers.txt
      - name: Identify indirect BIOS controller wrappers
        run: |
          python3 - <<'PY' > pad-wrappers.txt
          from pathlib import Path
          import re
          sources = {}
          targets = set()
          for path in sorted(Path('generated').glob('*.c')):
              lines = path.read_text().splitlines()
              sources[path] = lines
              for i,line in enumerate(lines):
                  m = re.search(r'/\* 0x([0-9a-f]{8}): 0x240a00b0 \*/',line,re.I)
                  if not m: continue
                  block = '\n'.join(lines[i:i+65])
                  if re.search(r'0x240900(?:12|13|14|15|16|5b)u?\b',block,re.I):
                      addr = int(m[1],16)
                      targets.add(addr)
                      print('WRAPPER',path.name,hex(addr))
                      print(block)
          for path,lines in sources.items():
              for i,line in enumerate(lines):
                  if any(re.search(r'\b(?:0x|func_|block_)'+format(t,'08X')+r'(?:u)?\b',line,re.I) for t in targets):
                      if re.search(r'call|dispatch|jal',line,re.I):
                          print('CALLER',path.name,i+1)
                          print('\n'.join(lines[max(0,i-12):i+14]))
          print('WRAPPER COUNT',len(targets))
          PY
          wc -l pad-wrappers.txt
          grep -E '^(WRAPPER|CALLER)' pad-wrappers.txt
          sed -n '/^CALLER/,$p' pad-wrappers.txt | head -n 450
      - name: Extract full initialization routines
        run: |
          python3 - <<'PY' > pad-init-routines.txt
          from pathlib import Path
          import re
          p = Path('generated/SLUS_012.74_full_28.c')
          lines = p.read_text().splitlines()
          for i in range(4100,5200):
              s = lines[i]
              if re.search(r'Address:|^void |^block_|cpu->gpr\[|CPS jal|return;|goto ',s):
                  if 'PGXP_' not in s or '0x' in s:
                      print(i+1,s.strip())
          PY
          cat pad-init-routines.txt
      - name: Locate callers of controller initialization routines
        run: |
          python3 - <<'PY' > pad-init-callers.txt
          from pathlib import Path
          import re
          p = Path('generated/SLUS_012.74_full_28.c')
          lines = p.read_text().splitlines()
          targets = {'800600FC'}
          for i in (4509,4948):
              for line in reversed(lines[:i]):
                  m = re.match(r'void func_([0-9A-Fa-f]+)\(',line)
                  if m:
                      targets.add(m[1].upper())
                      break
          print('TARGETS',sorted(targets))
          for path in sorted(Path('generated').glob('*.c')):
              lines = path.read_text().splitlines()
              for i,line in enumerate(lines):
                  if re.search(r'CPS (?:jal|j) -> 0x('+ '|'.join(sorted(targets)) +r')\b', line, re.I):
                      print('CALL',path.name,i+1)
                      print('\n'.join(lines[max(0,i-100):i+8]))
          PY
          cat pad-init-callers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: focus-source-audit
          path: |
            focus-source-audit.txt
            controller-api-audit.txt
            pad-hardware-audit.txt
            pad-callers.txt
            pad-wrappers.txt
            pad-init-routines.txt
            pad-init-callers.txt
